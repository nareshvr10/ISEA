name: Build Android APK

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Ensure Gradle Wrapper Exists
        run: |
          mkdir -p gradle/wrapper
          curl -fsSL https://raw.githubusercontent.com/gradle/gradle/v8.9.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
          ls -lh gradle/wrapper/gradle-wrapper.jar

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          # Use gradle directly or wrapper
          if command -v gradle &> /dev/null; then
            gradle assembleDebug --stacktrace --no-daemon
          else
            ./gradlew assembleDebug --stacktrace --no-daemon
          fi

      - name: Prepare Downloadable APK
        run: |
          mkdir -p build-artifacts
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/ISEA-v1.0.0-debug.apk
            echo "Successfully built ISEA-v1.0.0-debug.apk"
          else
            echo "Looking for apk files..."
            find app/build -name "*.apk" -exec cp {} build-artifacts/ISEA-v1.0.0-debug.apk \;
          fi

      - name: Upload APK as GitHub Download Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ISEA-v1.0.0-debug-apk
          path: build-artifacts/ISEA-v1.0.0-debug.apk
          retention-days: 30

      - name: Release APK on Tag Push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-artifacts/ISEA-v1.0.0-debug.apk
          name: ISEA Android APK ${{ github.ref_name }}
          body: |
            ## ISEA - Smart AI-IoT Waste Recycling & Event Sustainability System
            ### Android APK Build Release
            - Download `ISEA-v1.0.0-debug.apk` directly to install on your Android device.
            - Includes Real-time Firebase Sync, Event Plastic Processing live pipeline, and Liquid Recovery Tank telemetry.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
